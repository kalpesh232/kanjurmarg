<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Products</title>
</head>
<body>
    <form method="post">
        {% csrf_token %}
        <label>Name:</label>
        <input type="text" name="name"><br>
        <label>Price:</label>
        <input type="number" name="price"><br>
        <button type="submit">Register Product</button>
      </form>
      
</body>
</html>
