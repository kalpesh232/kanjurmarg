<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add an Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">

</head>

<body>
    <div class="container">
        <h1>Add an Employee</h1>
        <hr>
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        <hr>
        <form action="/add_emp" method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label for="f_name" class="form-label">First Name</label>
                <input type="text" class="form-control" name="f_name" id="f_name" aria-describedby="emailHelp">
            </div>

            <div class="mb-3">
                <label for="l_name" class="form-label">Last Name</label>
                <input type="text" class="form-control" name="l_name"  id="l_name" aria-describedby="emailHelp">
            </div>

            <div class="mb-3">
                <label for="dept" class="form-label">Department</label>

                <select name="dept" id="dept" class="form-control">
                    <option value="#">Choose a Department</option>
                    {% for dept in depts %}
                    <option value="{{dept.id}}"> {{dept}}</option>
                    {% endfor %}
                </select>

            </div>

            <div class="mb-3">
                <label for="sal" class="form-label">Salary</label>
                <input type="number" class="form-control" name="sal" id="sal" aria-describedby="emailHelp">
            </div>

            <div class="mb-3">
                <label for="bonus" class="form-label">Bonus</label>
                <input type="number" class="form-control"  name="bonus" id="bonus" aria-describedby="emailHelp">
            </div>

            <div class="mb-3">
                <label for="role" class="form-label">Role</label>

                <select name="role" id="role" class="form-control">
                    <option value="#">Choose a Role</option>
                    {% for rol in rols %}
                    <option value="{{rol.id}}">{{rol}}</option>
                    {% endfor %}
                </select>

            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" name="phone" id="phone" aria-describedby="emailHelp" minlength="10"
                    maxlength="10">
            </div>

            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Hire Date</label>
                <input type="date" class="form-control" name="h_date"  id="h_date" aria-describedby="emailHelp">
            </div>
            <center>
                <button type="submit" class="btn btn-secondary">Add Employee</button>
            </center>
        </form>
        <hr>
        <a class="btn btn-primary" href="\" role="button">Office Employee Management System</a>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>

</html>
