<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filter an Employee</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous">

</head>

<body>
  <div class="container">
    <h1>Filter an Employee</h1>
    <hr>
    <form action="/filter_emp" method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label for="f_name" class="form-label">First/Last Name</label>
        <input type="text" class="form-control" name="f_l_name" id="f_l_name" aria-describedby="emailHelp">
      </div>

      <div class="mb-3">
        <label for="dept" class="form-label">Department</label>
        <input type="text" class="form-control" name="dept" id="dept" aria-describedby="emailHelp">
      </div>

      <div class="mb-3">
        <label for="role" class="form-label">Role</label>
        <input type="text" class="form-control" name="rol" id="rol" aria-describedby="emailHelp">

      </div>

      <center>
        <button type="submit" class="btn btn-secondary">Filter Employee</button>
      </center>
    </form>
    <hr>
    <a class="btn btn-primary" href="\" role="button">Office Employee Management System</a>
  </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  crossorigin="anonymous"></script>

</html>
