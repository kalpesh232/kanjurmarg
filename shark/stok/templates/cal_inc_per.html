<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV File Upload</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #555;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            text-align: left;
        }

        input[type="file"], 
        input[type="number"], 
        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }

        input:focus, button:focus {
            outline: none;
            border-color: #4facfe;
        }

        button {
            background: #4facfe;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #00f2fe;
        }

        button:active {
            transform: scale(0.98);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h2 {
                font-size: 20px;
            }

            input[type="file"], 
            input[type="number"], 
            button {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Fine Diff in %</h2>
        <form action="/" method="post" >

            <label for="placed">Enter Place Price:</label>
            <input type="number" id="placed" name="placed" placeholder="Enter a number" required>

            <label for="low">Enter Low Price:</label>
            <input type="number" id="low" name="low" placeholder="Enter a number"  step="0.01">   

            <label for="high">Enter High Price:</label>
            <input type="number" id="high" name="high" placeholder="Enter a number"  step="0.01">

            <button type="submit">Upload and Calculate</button>
        </form>
    </div>
</body>
</html>
