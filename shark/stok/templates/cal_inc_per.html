<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Difference Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Modern Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #2d3436;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin-bottom: 30px;
            font-size: 28px;
            color: #2d3436;
            font-weight: 600;
            position: relative;
            display: inline-block;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(to right, #667eea, #764ba2);
            border-radius: 3px;
        }

        label {
            font-weight: 500;
            display: block;
            margin-bottom: 10px;
            text-align: left;
            color: #636e72;
            font-size: 14px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background-color: #f9f9f9;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            background-color: #fff;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        /* Floating label effect */
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            transform: translateY(-25px);
            font-size: 12px;
            color: #667eea;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .container {
                padding: 30px 25px;
            }
            
            h2 {
                font-size: 24px;
                margin-bottom: 25px;
            }
            
            input[type="number"] {
                padding: 12px 15px;
            }
            
            button {
                padding: 14px;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 25px 20px;
            }
            
            h2 {
                font-size: 22px;
            }
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container {
            animation: fadeIn 0.6s ease-out forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Price Difference Calculator</h2>
        <form action="/" method="post">
            <div class="input-group">
                <input type="number" id="placed" name="placed" placeholder=" " required>
                <label for="placed">Place Price</label>
            </div>
            
            <div class="input-group">
                <input type="number" id="low" name="low" placeholder=" " step="0.01">
                <label for="low">Low Price</label>
            </div>
            
            <div class="input-group">
                <input type="number" id="high" name="high" placeholder=" " step="0.01">
                <label for="high">High Price</label>
            </div>

            <button type="submit">Calculate Difference</button>
        </form>
    </div>

    <script>
        // Add floating label functionality
        document.querySelectorAll('.input-group input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentNode.querySelector('label').style.transform = 'translateY(-25px)';
                this.parentNode.querySelector('label').style.fontSize = '12px';
                this.parentNode.querySelector('label').style.color = '#667eea';
            });
            
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.parentNode.querySelector('label').style.transform = '';
                    this.parentNode.querySelector('label').style.fontSize = '';
                    this.parentNode.querySelector('label').style.color = '';
                }
            });
        });
    </script>
</body>
</html>
